name: CI

on:
  pull_request:
    branches: [main]
  # Push runs keep main's badge honest and catch anything that lands outside
  # the PR flow (an admin bypass, a release workflow push).
  push:
    branches: [main]
  # The contract-drift job below is the alarm for "ora shipped a contract this
  # build was not generated against". Until now it only ran on our own PRs, so
  # nothing woke it when ora released: 1.20.0 shipped and every `ax` run warned
  # about a stale contract for days before anyone noticed. On this schedule the
  # alarm fires on its own; workflow_dispatch is for checking straight after a
  # known ora release instead of waiting for the next run.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# Least privilege: CI only ever reads the repo.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version used for every single-version job. The test matrix below covers the
  # full range that package.json `engines` promises.
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH.
      # Version comes from the package.json `packageManager` field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      # One Node version failing shouldn't hide the result on the others.
      fail-fast: false
      matrix:
        # Floor is package.json `engines.node`; the rest are current LTS/latest.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:ci

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Runs the bundled binary the way a user would. Catches the failures unit
      # tests structurally cannot: bad shebang, lost executable bit, stale version.
      - name: Smoke test bundled CLI
        run: pnpm smoke

      # Proves the tarball npm would publish actually contains a usable bin —
      # an unbuilt dist publishes silently and is expensive to discover later.
      - name: Verify publishable tarball
        run: pnpm verify:pack

  contract-drift:
    name: Contract drift vs production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regenerate the checked-in contract artifacts from the spec production
      # serves. A diff means ora.ai shipped a contract this build has not been
      # generated against - the red build IS the drift alarm. Fix: pnpm
      # contract:gen, review, commit.
      - name: Regenerate from https://ora.ai/api/openapi.json
        run: pnpm contract:gen

      - name: Fail on drift
        run: git diff --exit-code src/contract

  # Aggregate gate: branch protection on `main` requires a single status check
  # named `ci` instead of chasing per-matrix job names. contract-drift is
  # deliberately excluded — drift means ora shipped, not that this PR is wrong,
  # and a required check nobody's PR can fix teaches everyone to bypass gates.
  ci:
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    steps:
      - name: Verify every required job passed
        env:
          RESULTS: quality=${{ needs.quality.result }} test=${{ needs.test.result }} build=${{ needs.build.result }}
        run: |
          echo "$RESULTS"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi
          echo "All required checks passed."
